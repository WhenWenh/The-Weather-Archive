<main>
  <h1 class="logo">The Weather Archive</h1>

  <form (submit)="search($event, city.value)">
    <label for="city">Search for a city</label>
    <input id="city" name="city" type="search" #city
           placeholder="e.g. Vienna" required>
    <button type="submit">Search</button>
  </form>

  <p role="status">{{ message() }}</p>
</main>
